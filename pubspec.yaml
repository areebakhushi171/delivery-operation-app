name: delivery_ops_companion
description: Delivery Operations Companion - Rider and Admin/Dispatcher logistics app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  go_router: ^14.6.2
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.1
  image_picker: ^1.1.2
